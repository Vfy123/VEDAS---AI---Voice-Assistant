<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEDAS AI — Desktop Floating Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    :root {
      --blue-primary: #00d2ff;
      --blue-glow: rgba(0, 210, 255, 0.45);
      --orange-primary: #ff7b00;
      --orange-glow: rgba(255, 123, 0, 0.45);
      --bg-dark: rgba(7, 12, 24, 0.94);
      --bg-card: rgba(14, 23, 42, 0.88);
      --border-glow: rgba(0, 210, 255, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 6px;
    }

    /* Floating Capsule Widget */
    .desktop-widget-capsule {
      width: 100%;
      max-width: 440px;
      background: var(--bg-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glow);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), 0 0 20px var(--blue-glow), 0 0 15px var(--orange-glow);
      position: relative;
      cursor: grab;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      -webkit-app-region: drag;
    }

    .desktop-widget-capsule:active {
      cursor: grabbing;
    }

    .widget-interactive {
      -webkit-app-region: no-drag;
    }

    /* Logo Badge */
    .widget-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-primary), var(--orange-primary));
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 0 12px var(--blue-glow);
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Mic Button */
    .widget-mic-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #ff6b08);
      color: #fff;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--orange-glow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      position: relative;
    }

    .widget-mic-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px var(--orange-primary);
    }

    .widget-mic-btn.listening {
      animation: micPulse 1.2s infinite alternate;
      background: linear-gradient(135deg, #ef4444, #ff7b00);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }

    @keyframes micPulse {
      0% { transform: scale(1); box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 28px rgba(255, 123, 0, 0.85); }
    }

    /* Waveform & Transcript Box */
    .widget-wave-box {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0, 210, 255, 0.25);
      flex: 1;
      overflow: hidden;
    }

    .widget-wave-canvas {
      width: 75px;
      height: 22px;
      flex-shrink: 0;
    }

    .widget-transcript {
      font-size: 0.8rem;
      color: var(--blue-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* Input Field */
    .widget-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 12px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
      transition: all 0.2s;
    }

    .widget-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--blue-primary);
      box-shadow: 0 0 10px var(--blue-glow);
    }

    /* Action Buttons */
    .widget-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .widget-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .widget-btn:hover {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--blue-primary);
      color: #fff;
      transform: scale(1.06);
    }

    .widget-send-btn {
      background: linear-gradient(135deg, var(--blue-primary), #0284c7);
      border: none;
      color: #fff;
      box-shadow: 0 0 10px var(--blue-glow);
    }

    /* Floating Response Bubble */
    .widget-response-bubble {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 10px;
      right: 10px;
      background: var(--bg-dark);
      backdrop-filter: blur(24px);
      border: 1px solid var(--orange-glow);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--orange-glow);
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      animation: fadeInSlide 0.25s ease-out forwards;
      -webkit-app-region: no-drag;
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--orange-primary);
    }

    .bubble-content {
      font-size: 0.82rem;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .bubble-close {
      cursor: pointer;
      color: var(--text-muted);
      background: none;
      border: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Floating Desktop Capsule -->
  <div class="desktop-widget-capsule" id="widget-capsule">
    <!-- Response Bubble -->
    <div class="widget-response-bubble" id="widget-response-bubble">
      <div class="bubble-header">
        <span>⚡ VEDAS AI Core</span>
        <button class="bubble-close" onclick="closeBubble()">✕</button>
      </div>
      <div class="bubble-content" id="widget-response-text">Thinking...</div>
    </div>

    <!-- Logo / Expand Full App -->
    <div class="widget-logo widget-interactive" onclick="openMasterApp()" title="⚡ Expand to Full VEDAS Master App">⚡</div>

    <!-- Big Glowing Mic Button -->
    <button class="widget-mic-btn widget-interactive" id="widget-mic-btn" onclick="toggleVoice()" title="Voice AI [Ctrl+M]">
      🎙️
    </button>

    <!-- Waveform & Transcript -->
    <div class="widget-wave-box" id="widget-wave-box">
      <canvas class="widget-wave-canvas" id="widget-wave-canvas" width="75" height="22"></canvas>
      <span class="widget-transcript" id="widget-transcript">Listening...</span>
    </div>

    <!-- Quick Text Input -->
    <input type="text" class="widget-input widget-interactive" id="widget-input" placeholder="Ask Vedas or say 'open notepad'..." />

    <!-- Action Tools -->
    <div class="widget-actions widget-interactive">
      <button class="widget-btn widget-send-btn" onclick="sendMessage()" title="Send Query">➤</button>
      <button class="widget-btn" onclick="openMasterApp()" title="Open Full App">⤢</button>
      <button class="widget-btn" onclick="takeScreenshot()" title="Take Screenshot">📸</button>
    </div>
  </div>

  <script>
    let isListening = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let animId = null;

    // Speech Recognition Setup
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('widget-mic-btn').classList.add('listening');
        document.getElementById('widget-input').style.display = 'none';
        document.getElementById('widget-wave-box').style.display = 'flex';
        document.getElementById('widget-transcript').textContent = 'Listening...';
        startWaveAnimation();
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('widget-transcript').textContent = transcript || 'Listening...';
        if (event.results[0].isFinal) {
          executeVoiceQuery(transcript);
        }
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => stopListening();
    }

    function toggleVoice() {
      if (!recognition) {
        alert('Speech recognition not supported in this browser.');
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopListening() {
      isListening = false;
      document.getElementById('widget-mic-btn').classList.remove('listening');
      document.getElementById('widget-wave-box').style.display = 'none';
      document.getElementById('widget-input').style.display = 'block';
      if (animId) cancelAnimationFrame(animId);
    }

    function startWaveAnimation() {
      const canvas = document.getElementById('widget-wave-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let step = 0;

      function render() {
        if (!isListening) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        
        // Dual Blue & Orange Waves
        ctx.strokeStyle = '#00d2ff';
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 2) {
          const y = (canvas.height / 2) + Math.sin((x * 0.1) + step) * 6;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        ctx.strokeStyle = '#ff7b00';
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 2) {
          const y = (canvas.height / 2) + Math.cos((x * 0.12) - step) * 5;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        step += 0.2;
        animId = requestAnimationFrame(render);
      }
      render();
    }

    async function executeVoiceQuery(text) {
      stopListening();
      if (!text || !text.trim()) return;
      showResponse('Processing: ' + text + '...');
      await sendQueryToServer(text.trim());
    }

    async function sendMessage() {
      const input = document.getElementById('widget-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      showResponse('Thinking...');
      await sendQueryToServer(text);
    }

    async function sendQueryToServer(prompt) {
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, persona: 'master_vedas' })
        });
        const data = await res.json();
        const reply = data.text || data.message || 'Action executed.';
        showResponse(reply);
        speakReply(reply);
      } catch (err) {
        showResponse('Error: ' + err.message);
      }
    }

    function showResponse(text) {
      const bubble = document.getElementById('widget-response-bubble');
      const content = document.getElementById('widget-response-text');
      bubble.style.display = 'flex';
      content.textContent = text;
    }

    function closeBubble() {
      document.getElementById('widget-response-bubble').style.display = 'none';
      if (synth) synth.cancel();
    }

    function speakReply(text) {
      if (!synth) return;
      synth.cancel();
      const clean = text.replace(/[*#`_\[\]()]/g, '').slice(0, 300);
      const utter = new SpeechSynthesisUtterance(clean);
      utter.rate = 1.05;
      utter.pitch = 1.0;
      synth.speak(utter);
    }

    function openMasterApp() {
      window.open('/', '_blank');
    }

    async function takeScreenshot() {
      showResponse('Capturing screenshot...');
      try {
        await fetch('/api/system/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: 'screenshot' })
        });
        showResponse('📸 Screenshot taken!');
      } catch (e) {
        showResponse('Screenshot error: ' + e.message);
      }
    }

    document.getElementById('widget-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm') {
        e.preventDefault();
        toggleVoice();
      }
    });
  </script>
</body>
</html>
